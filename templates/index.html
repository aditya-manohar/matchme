<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchMe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --primary-dark: #5A52E0;
            --text: #2D3748;
            --light: #F7FAFC;
            --gray: #E2E8F0;
            --dark-gray: #718096;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .main-container {
            width: 100%;
            max-width: 600px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #6C63FF, #FF6B6B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }

        .logo-icon {
            font-size: 28px;
            background: linear-gradient(135deg, #6C63FF, #FF6B6B);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text);
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            color: var(--dark-gray);
            font-size: 14px;
        }

        .upload-form {
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed var(--gray);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: var(--primary);
        }

        .upload-area.has-preview {
            padding: 0;
            border: none;
        }

        .upload-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upload-icon {
            width: 30px;
            height: 30px;
            margin-bottom: 15px;
            opacity: .8;
        }

        .main-text {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .secondary-text {
            font-size: 14px;
            color: var(--dark-gray);
        }

        .preview-container {
            display: none;
            width: 100%;
        }

        .upload-area.has-preview .preview-container {
            display: block;
        }

        .upload-area.has-preview .upload-content {
            display: none;
        }

        .image-preview {
            position: relative;
            width: 100%;
            height: 300px;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .remove-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.1);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        .spinner.hidden {
            display: none;
        }

        .dragover {
            background: rgba(108, 99, 255, 0.05);
            border-color: var(--primary) !important;
        }

        #fileInput {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .glass-card {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .logo-text {
                font-size: 20px;
            }

            .logo-icon {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <span class="logo-icon">🎭</span>
        <span class="logo-text">MatchMe</span>
    </div>

    <div class="main-container">
        <div class="glass-card">
            <div class="header">
                <h1>Find Your <span>Tollywood</span> Twin</h1>
                <p class="subtitle">Upload your photo to discover which celebrity you resemble most</p>
            </div>

            <form method="POST" action="/" enctype="multipart/form-data" class="upload-form">
                <div class="upload-area" id="uploadArea">
                    <input type="file" name="file" id="fileInput" accept="image/*" required>
                    <div class="upload-content">
                        <img src="{{ url_for('static', filename='images/upload-icon.svg') }}" alt="Upload"
                            class="upload-icon">
                        <div class="upload-text">
                            <p class="main-text">Drag & drop your photo</p>
                            <p class="secondary-text">or click to browse files</p>
                        </div>
                    </div>
                    <div class="preview-container" id="previewContainer"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Find My Match</span>
                    <div class="spinner hidden" id="spinner"></div>
                </button>
            </form>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewContainer = document.getElementById('previewContainer');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');

        // Make the whole upload area clickable
        uploadArea.addEventListener('click', function () {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', function (e) {
            if (e.target.files.length) {
                const file = e.target.files[0];
                const reader = new FileReader();

                reader.onload = function (event) {
                    previewContainer.innerHTML = `
                        <div class="image-preview">
                            <img src="${event.target.result}" alt="Preview">
                            <button type="button" class="remove-btn" id="removeBtn">×</button>
                        </div>
                    `;

                    uploadArea.classList.add('has-preview');

                    // Add remove button functionality
                    document.getElementById('removeBtn').addEventListener('click', function (e) {
                        e.stopPropagation(); // Prevent triggering the upload area click
                        fileInput.value = '';
                        previewContainer.innerHTML = '';
                        uploadArea.classList.remove('has-preview');
                    });
                }

                reader.readAsDataURL(file);
            }
        });

        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                const event = new Event('change');
                fileInput.dispatchEvent(event);
            }
        });

        // Loading state
        document.querySelector('form').addEventListener('submit', function () {
            submitBtn.disabled = true;
            document.querySelector('.btn-text').textContent = 'Analyzing...';
            spinner.classList.remove('hidden');
        });
    </script>
</body>

</html>
